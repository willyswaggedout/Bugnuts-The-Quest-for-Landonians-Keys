<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Star Dodger</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html, body {
    margin: 0; height: 100%; background: #0b1020; overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));
  resize();

  // ---------- storage (optional, may be unavailable) ----------
  let best = 0;
  try { best = parseInt(localStorage.getItem('stardodger-best') || '0', 10) || 0; } catch (e) {}
  function saveBest() { try { localStorage.setItem('stardodger-best', String(best)); } catch (e) {} }

  // ---------- audio (starts only after a tap) ----------
  let actx = null;
  function initAudio() {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
    } catch (e) { actx = null; }
  }
  function beep(freq, dur, type, vol) {
    if (!actx) return;
    try {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'square'; o.frequency.value = freq;
      g.gain.value = vol || 0.05;
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) {}
  }

  // ---------- state ----------
  let state = 'title'; // title | play | over
  let overAt = 0;
  const ship = { x: 0, y: 0, tx: 0, ty: 0 };
  let bullets, enemies, gems, parts, stars;
  let score, lives, spawnT, fireT, invuln, shake, elapsed;

  function makeStars() {
    stars = [];
    for (let i = 0; i < 70; i++) {
      stars.push({ x: Math.random() * W, y: Math.random() * H, s: 0.5 + Math.random() * 1.5, v: 20 + Math.random() * 60 });
    }
  }
  makeStars();

  function reset() {
    bullets = []; enemies = []; gems = []; parts = [];
    score = 0; lives = 3; spawnT = 0.5; fireT = 0; invuln = 0; shake = 0; elapsed = 0;
    ship.x = ship.tx = W / 2;
    ship.y = ship.ty = H * 0.78;
  }
  reset();

  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = 40 + Math.random() * 180;
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.4 + Math.random() * 0.4, max: 0.8, color });
    }
  }

  // ---------- input ----------
  let touching = false;
  function pointerPos(e) { return { x: e.clientX, y: e.clientY }; }

  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    initAudio();
    if (state === 'title') { reset(); state = 'play'; beep(660, 0.12, 'triangle', 0.08); }
    else if (state === 'over') {
      if (performance.now() - overAt > 600) { reset(); state = 'play'; beep(660, 0.12, 'triangle', 0.08); }
    }
    touching = true;
    const p = pointerPos(e);
    ship.tx = p.x; ship.ty = p.y - 70; // keep the ship above the finger
  }, { passive: false });

  cv.addEventListener('pointermove', e => {
    e.preventDefault();
    if (!touching) return;
    const p = pointerPos(e);
    ship.tx = p.x; ship.ty = p.y - 70;
  }, { passive: false });

  const endTouch = () => { touching = false; };
  cv.addEventListener('pointerup', endTouch);
  cv.addEventListener('pointercancel', endTouch);

  // block iOS gestures (pinch zoom, double-tap zoom, rubber-band scroll)
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(n =>
    document.addEventListener(n, e => e.preventDefault()));
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

  // ---------- game logic ----------
  function spawn() {
    const diff = 1 + score / 350;
    if (Math.random() < 0.14) {
      gems.push({ x: 24 + Math.random() * (W - 48), y: -20, vy: 110 + Math.random() * 40, t: 0 });
    } else {
      const r = 13 + Math.random() * 15;
      enemies.push({
        x: r + Math.random() * (W - r * 2), y: -r,
        r, hp: r > 22 ? 2 : 1,
        vy: (85 + Math.random() * 70) * Math.sqrt(diff),
        rot: Math.random() * 6, spin: (Math.random() - 0.5) * 3,
        seed: Math.random() * 1000
      });
    }
    spawnT = Math.max(0.3, 0.85 - score / 1800);
  }

  function update(dt) {
    elapsed += dt;
    // background stars always drift
    for (const s of stars) { s.y += s.v * dt; if (s.y > H) { s.y = -2; s.x = Math.random() * W; } }
    for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
    parts = parts.filter(p => p.life > 0);
    shake = Math.max(0, shake - dt * 30);
    if (state !== 'play') return;

    // ship follows finger smoothly, clamped to screen
    const k = Math.min(1, dt * 16);
    ship.x += (ship.tx - ship.x) * k;
    ship.y += (ship.ty - ship.y) * k;
    ship.x = Math.max(18, Math.min(W - 18, ship.x));
    ship.y = Math.max(H * 0.25, Math.min(H - 40, ship.y));
    invuln = Math.max(0, invuln - dt);

    // auto-fire
    fireT -= dt;
    if (fireT <= 0) {
      bullets.push({ x: ship.x, y: ship.y - 18 });
      fireT = 0.2;
      beep(880, 0.04, 'square', 0.015);
    }

    spawnT -= dt;
    if (spawnT <= 0) spawn();

    for (const b of bullets) b.y -= 620 * dt;
    bullets = bullets.filter(b => b.y > -20);

    for (const e of enemies) { e.y += e.vy * dt; e.rot += e.spin * dt; }
    for (const g of gems) { g.y += g.vy * dt; g.t += dt; }

    // bullets vs enemies
    for (const b of bullets) {
      for (const e of enemies) {
        if (e.hp > 0 && Math.hypot(b.x - e.x, b.y - e.y) < e.r + 4) {
          b.y = -100; e.hp--;
          burst(b.x, b.y < 0 ? e.y : b.y, '#ffd166', 4);
          if (e.hp <= 0) {
            score += 10; burst(e.x, e.y, '#ff6b6b', 14);
            beep(160, 0.15, 'sawtooth', 0.05);
          } else { beep(300, 0.05, 'square', 0.03); }
          break;
        }
      }
    }

    // enemies vs ship
    for (const e of enemies) {
      if (e.hp > 0 && invuln <= 0 && Math.hypot(ship.x - e.x, ship.y - e.y) < e.r + 12) {
        e.hp = 0; lives--; invuln = 1.3; shake = 10;
        burst(ship.x, ship.y, '#7dd3fc', 22);
        beep(90, 0.3, 'sawtooth', 0.08);
        if (lives <= 0) {
          state = 'over'; overAt = performance.now();
          if (score > best) { best = score; saveBest(); }
        }
      }
    }

    // gems
    for (const g of gems) {
      if (Math.hypot(ship.x - g.x, ship.y - g.y) < 26) {
        g.y = H + 100; score += 25; burst(g.x, g.y, '#fde047', 10);
        beep(1100, 0.1, 'triangle', 0.06);
      }
    }
    enemies = enemies.filter(e => e.hp > 0 && e.y < H + 50);
    gems = gems.filter(g => g.y < H + 40);
  }

  // ---------- drawing ----------
  function drawShip() {
    if (state === 'over') return;
    if (invuln > 0 && Math.floor(invuln * 12) % 2 === 0) return;
    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.shadowColor = '#38bdf8'; ctx.shadowBlur = 16;
    ctx.fillStyle = '#7dd3fc';
    ctx.beginPath();
    ctx.moveTo(0, -20); ctx.lineTo(15, 14); ctx.lineTo(0, 7); ctx.lineTo(-15, 14);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#f97316';
    const f = 6 + Math.random() * 6;
    ctx.beginPath(); ctx.moveTo(-5, 9); ctx.lineTo(0, 9 + f); ctx.lineTo(5, 9); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawEnemy(e) {
    ctx.save();
    ctx.translate(e.x, e.y); ctx.rotate(e.rot);
    ctx.fillStyle = e.r > 22 ? '#a855f7' : '#f87171';
    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 10;
    ctx.beginPath();
    const n = 8;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      const rr = e.r * (0.78 + 0.22 * Math.abs(Math.sin(e.seed + i * 1.7)));
      const x = Math.cos(a) * rr, y = Math.sin(a) * rr;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawGem(g) {
    ctx.save();
    ctx.translate(g.x, g.y);
    const s = 1 + Math.sin(g.t * 8) * 0.12;
    ctx.scale(s, s);
    ctx.fillStyle = '#fde047'; ctx.shadowColor = '#facc15'; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.moveTo(0, -13); ctx.lineTo(10, 0); ctx.lineTo(0, 13); ctx.lineTo(-10, 0);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function centerText(txt, y, size, color, weight) {
    ctx.fillStyle = color; ctx.textAlign = 'center';
    ctx.font = (weight || '600') + ' ' + size + 'px -apple-system, system-ui, sans-serif';
    ctx.fillText(txt, W / 2, y);
  }

  function draw() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0b1020'); g.addColorStop(1, '#1a1040');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    ctx.fillStyle = '#fff';
    for (const s of stars) { ctx.globalAlpha = 0.3 + s.s / 3; ctx.fillRect(s.x, s.y, s.s, s.s); }
    ctx.globalAlpha = 1;

    ctx.fillStyle = '#fef08a';
    for (const b of bullets) ctx.fillRect(b.x - 2, b.y - 8, 4, 14);
    enemies.forEach(drawEnemy);
    gems.forEach(drawGem);
    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color; ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
    drawShip();
    ctx.restore();

    // HUD
    if (state !== 'title') {
      ctx.textAlign = 'left'; ctx.fillStyle = '#e2e8f0';
      ctx.font = '700 24px -apple-system, system-ui, sans-serif';
      ctx.fillText(String(score), 16, 36);
      ctx.font = '500 13px -apple-system, system-ui, sans-serif';
      ctx.fillStyle = '#94a3b8';
      ctx.fillText('BEST ' + best, 16, 56);
      ctx.textAlign = 'right'; ctx.font = '22px -apple-system, system-ui, sans-serif';
      ctx.fillStyle = '#fb7185';
      ctx.fillText('♥'.repeat(Math.max(0, lives)), W - 16, 36);
    }

    if (state === 'title') {
      ctx.fillStyle = 'rgba(11,16,32,0.55)'; ctx.fillRect(0, 0, W, H);
      centerText('STAR DODGER', H * 0.34, Math.min(44, W * 0.11), '#e2e8f0', '800');
      centerText('Drag to fly • your ship auto-fires', H * 0.34 + 38, 16, '#94a3b8', '500');
      centerText('Shoot rocks • grab the gold gems', H * 0.34 + 62, 16, '#94a3b8', '500');
      const pulse = 0.6 + Math.sin(performance.now() / 300) * 0.4;
      ctx.globalAlpha = pulse;
      centerText('TAP TO START', H * 0.58, 22, '#7dd3fc', '700');
      ctx.globalAlpha = 1;
      if (best) centerText('Best: ' + best, H * 0.58 + 36, 15, '#94a3b8', '500');
    } else if (state === 'over') {
      ctx.fillStyle = 'rgba(11,16,32,0.65)'; ctx.fillRect(0, 0, W, H);
      centerText('GAME OVER', H * 0.36, Math.min(40, W * 0.1), '#fb7185', '800');
      centerText('Score ' + score, H * 0.36 + 42, 24, '#e2e8f0', '700');
      centerText(score >= best && score > 0 ? 'New best!' : 'Best ' + best, H * 0.36 + 72, 16, '#fde047', '600');
      if (performance.now() - overAt > 600) {
        const pulse = 0.6 + Math.sin(performance.now() / 300) * 0.4;
        ctx.globalAlpha = pulse;
        centerText('TAP TO PLAY AGAIN', H * 0.36 + 130, 20, '#7dd3fc', '700');
        ctx.globalAlpha = 1;
      }
    }
  }

  // ---------- main loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
